<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>برنامه در حال بروزرسانی - عربی هفتم</title>
    <meta name="theme-color" content="#1976d2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="عربی هفتم">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon-512.png">
    
    <style>
        @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');
        
        * {
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #1976d2 0%, #1565c0 50%, #6a1b9a 100%);
            background-size: 200% 200%;
            animation: gradientMove 15s ease infinite;
        }
        
        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* ذرات متحرک پس‌زمینه */
        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }
        
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: floatParticle linear infinite;
        }
        
        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
                transform: translateY(90vh) scale(1);
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(0.5);
                opacity: 0;
            }
        }
        
        /* کانتینر اصلی */
        .maintenance-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            animation: containerFadeIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        @keyframes containerFadeIn {
            0% {
                transform: scale(0.7) translateY(30px);
                opacity: 0;
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }
        
        .maintenance-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 45px 30px 35px 30px;
            text-align: center;
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.3) inset;
            position: relative;
            overflow: hidden;
        }
        
        .maintenance-card::before {
            content: '';
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 200px;
            background: radial-gradient(circle, rgba(25, 118, 210, 0.25) 0%, transparent 70%);
            border-radius: 50%;
            animation: topGlow 3s ease-in-out infinite;
            pointer-events: none;
        }
        
        @keyframes topGlow {
            0%, 100% {
                opacity: 0.5;
                transform: translateX(-50%) scale(1);
            }
            50% {
                opacity: 1;
                transform: translateX(-50%) scale(1.2);
            }
        }
        
        /* آیکون چرخ‌دنده */
        .gear-wrapper {
            width: 130px;
            height: 130px;
            margin: 0 auto 25px auto;
            position: relative;
            z-index: 2;
        }
        
        .gear-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            box-shadow: 
                0 15px 40px rgba(25, 118, 210, 0.35),
                0 0 0 6px rgba(255, 255, 255, 0.5),
                0 0 0 12px rgba(25, 118, 210, 0.1);
            animation: bgPulse 2s ease-in-out infinite;
        }
        
        @keyframes bgPulse {
            0%, 100% {
                box-shadow: 
                    0 15px 40px rgba(25, 118, 210, 0.35),
                    0 0 0 6px rgba(255, 255, 255, 0.5),
                    0 0 0 12px rgba(25, 118, 210, 0.1);
            }
            50% {
                box-shadow: 
                    0 15px 50px rgba(25, 118, 210, 0.5),
                    0 0 0 6px rgba(255, 255, 255, 0.7),
                    0 0 0 18px rgba(25, 118, 210, 0.15);
            }
        }
        
        .gear-svg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            color: #1976d2;
            animation: gearRotate 3s linear infinite;
            z-index: 1;
        }
        
        @keyframes gearRotate {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        .gear-svg svg {
            width: 100%;
            height: 100%;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 4px 8px rgba(25, 118, 210, 0.3));
        }
        
        /* عنوان */
        .maintenance-title {
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(135deg, #1976d2 0%, #6a1b9a 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            position: relative;
            z-index: 2;
        }
        
        .title-decoration {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
        }
        
        .title-decoration .line {
            height: 3px;
            width: 40px;
            border-radius: 3px;
            background: linear-gradient(90deg, transparent, #1976d2, transparent);
        }
        
        .title-decoration .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1976d2;
            animation: dotPulse 1.5s ease-in-out infinite;
        }
        
        @keyframes dotPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.5);
                opacity: 0.5;
            }
        }
        
        /* متن توضیحات */
        .maintenance-text {
            font-size: 15px;
            color: #546e7a;
            font-weight: bold;
            line-height: 2;
            margin-bottom: 25px;
            position: relative;
            z-index: 2;
        }
        
        .maintenance-text .highlight {
            color: #1976d2;
            font-weight: 900;
        }
        
        /* نوار پیشرفت */
        .progress-wrapper {
            width: 100%;
            height: 10px;
            background: #e3f2fd;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
            box-shadow: 0 2px 8px rgba(25, 118, 210, 0.15) inset;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #1976d2, #6a1b9a, #1976d2);
            background-size: 200% 100%;
            border-radius: 10px;
            animation: progressMove 2s linear infinite;
            width: 60%;
            position: relative;
            box-shadow: 0 0 15px rgba(25, 118, 210, 0.5);
        }
        
        @keyframes progressMove {
            0% {
                background-position: 100% 0;
                transform: translateX(-100%);
            }
            100% {
                background-position: -100% 0;
                transform: translateX(200%);
            }
        }
        
        /* زمان تقریبی */
        .time-box {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #fff8e1, #ffecb3);
            border: 2px solid #ffc107;
            border-radius: 50px;
            padding: 10px 22px;
            margin-bottom: 22px;
            font-size: 14px;
            font-weight: 900;
            color: #e65100;
            position: relative;
            z-index: 2;
            box-shadow: 0 4px 12px rgba(255, 193, 7, 0.3);
        }
        
        .time-box .clock-icon {
            font-size: 18px;
            animation: clockTick 1s steps(2) infinite;
        }
        
        @keyframes clockTick {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }
        
        /* دکمه تلاش دوباره */
        .retry-btn {
            background: linear-gradient(135deg, #1976d2 0%, #1565c0 100%);
            color: #fff;
            border: none;
            padding: 16px 32px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 20px rgba(25, 118, 210, 0.4);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 2;
            margin-bottom: 15px;
        }
        
        .retry-btn:active {
            transform: scale(0.97);
            box-shadow: 0 3px 12px rgba(25, 118, 210, 0.5);
        }
        
        .retry-btn svg {
            width: 20px;
            height: 20px;
            stroke: #fff;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.5s ease;
        }
        
        .retry-btn.loading svg {
            animation: retrySpin 1s linear infinite;
        }
        
        @keyframes retrySpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* پیام پایین */
        .footer-msg {
            font-size: 13px;
            color: #90a4ae;
            font-weight: bold;
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        
        .footer-msg .star {
            animation: starTwinkle 1.5s ease-in-out infinite;
        }
        
        @keyframes starTwinkle {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        
        /* اطلاعات نسخه */
        .version-info {
            margin-top: 20px;
            font-size: 11px;
            color: #b0bec5;
            font-weight: bold;
            position: relative;
            z-index: 2;
        }
        
        /* پیام خطای اتصال */
        .connection-msg {
            display: none;
            background: linear-gradient(135deg, #ffebee, #ffcdd2);
            border: 2px solid #ef5350;
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 15px;
            font-size: 12px;
            font-weight: bold;
            color: #c62828;
            position: relative;
            z-index: 2;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }
        
        .connection-msg.show {
            display: flex;
            animation: shakeWarning 0.5s ease;
        }
        
        @keyframes shakeWarning {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        /* ریسپانسیو */
        @media (max-width: 400px) {
            .maintenance-card {
                padding: 35px 22px 25px 22px;
                border-radius: 26px;
            }
            .gear-wrapper { width: 110px; height: 110px; margin-bottom: 20px; }
            .gear-bg { width: 110px; height: 110px; }
            .gear-svg { width: 65px; height: 65px; }
            .maintenance-title { font-size: 22px; }
            .maintenance-text { font-size: 14px; }
            .retry-btn { font-size: 15px; padding: 14px 28px; }
        }
    </style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="maintenance-container">
    <div class="maintenance-card">
        
        <div class="gear-wrapper">
            <div class="gear-bg"></div>
            <div class="gear-svg">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </div>
        </div>
        
        <div class="maintenance-title">برنامه در حال بروزرسانیه</div>
        
        <div class="title-decoration">
            <div class="line"></div>
            <div class="dot"></div>
            <div class="line"></div>
        </div>
        
        <div class="maintenance-text">
            داریم <span class="highlight">چیزهای باحالی</span> اضافه می‌کنیم<br>
            تا تجربه‌ی یادگیریت بهتر بشه! 🚀
        </div>
        
        <div class="progress-wrapper">
            <div class="progress-bar"></div>
        </div>
        
        <div class="time-box">
            <span class="clock-icon">⏰</span>
            <span id="time-text">کمی صبر کن، به‌زودی برمی‌گردیم!</span>
        </div>
        
        <div class="connection-msg" id="connection-msg">
            <span>⚠️</span>
            <span>اتصال به سرور برقرار نشد!</span>
        </div>
        
        <button class="retry-btn" onclick="retryCheck()" id="retry-btn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <polyline points="23 4 23 10 17 10"/>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
            <span id="retry-text">تلاش دوباره</span>
        </button>
        
        <div class="footer-msg">
            <span class="star">🌟</span>
            <span>ممنون از صبر و همراهیت</span>
            <span class="star">🌟</span>
        </div>
        
        <div class="version-info">عربی هفتم • نسخه ۱.۰.۰</div>
    </div>
</div>

<script>
    // ============ ساخت ذرات متحرک ============
    function createParticles() {
        const container = document.getElementById('particles');
        if (!container) return;
        const particleCount = 25;
        
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            
            const size = Math.random() * 8 + 3;
            const left = Math.random() * 100;
            const duration = Math.random() * 15 + 10;
            const delay = Math.random() * 10;
            
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = left + '%';
            particle.style.animationDuration = duration + 's';
            particle.style.animationDelay = delay + 's';
            particle.style.opacity = Math.random() * 0.5 + 0.2;
            
            container.appendChild(particle);
        }
    }
    
    // ============ بررسی مجدد وضعیت ============
    async function retryCheck() {
        const btn = document.getElementById('retry-btn');
        const retryText = document.getElementById('retry-text');
        const timeText = document.getElementById('time-text');
        const connectionMsg = document.getElementById('connection-msg');
        
        btn.classList.add('loading');
        retryText.textContent = 'در حال بررسی...';
        connectionMsg.classList.remove('show');
        
        try {
            const response = await fetch('./maintenance.json?t=' + Date.now(), { cache: 'no-store' });
            
            if (response.ok) {
                const data = await response.json();
                
                if (data.maintenance === false) {
                    // برنامه دیگه در حالت تعمیر نیست
                    retryText.textContent = 'در حال ورود...';
                    timeText.textContent = 'آماده شد! در حال انتقال... ✅';
                    
                    setTimeout(() => {
                        window.location.href = './index.html';
                    }, 600);
                    return;
                } else {
                    // هنوز در حالت تعمیر
                    retryText.textContent = 'هنوز در حال بروزرسانیه!';
                    timeText.textContent = 'کمی دیگه صبر کن... 😅';
                    vibrateError();
                    
                    setTimeout(() => {
                        btn.classList.remove('loading');
                        retryText.textContent = 'تلاش دوباره';
                        timeText.textContent = 'کمی صبر کن، به‌زودی برمی‌گردیم!';
                    }, 2500);
                    return;
                }
            }
        } catch(e) {
            console.log('خطا در اتصال:', e);
            connectionMsg.classList.add('show');
        }
        
        // اگه خطا داد یا سرور در دسترس نبود
        setTimeout(() => {
            btn.classList.remove('loading');
            retryText.textContent = 'تلاش دوباره';
            timeText.textContent = 'کمی صبر کن، به‌زودی برمی‌گردیم!';
        }, 2000);
    }
    
    function vibrateError() {
        if (navigator.vibrate) {
            navigator.vibrate([50, 30, 50]);
        }
    }
    
    function vibrateSuccess() {
        if (navigator.vibrate) {
            navigator.vibrate(30);
        }
    }
    
    // ============ شروع ============
    window.addEventListener('load', () => {
        createParticles();
    });
    
    // ============ بررسی خودکار هر ۳۰ ثانیه ============
    setInterval(async () => {
        try {
            const response = await fetch('./maintenance.json?t=' + Date.now(), { cache: 'no-store' });
            if (response.ok) {
                const data = await response.json();
                if (data.maintenance === false) {
                    // برنامه آماده شد - ریدایرکت خودکار
                    document.getElementById('time-text').textContent = 'آماده شد! در حال انتقال... ✅';
                    setTimeout(() => {
                        window.location.href = './index.html';
                    }, 800);
                }
            }
        } catch(e) {
            // اگه خطا داد، نادیده بگیر
        }
    }, 30000);
</script>

</body>
</html>
