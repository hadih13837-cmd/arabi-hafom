<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>جزوه و کلمات - عربی هفتم</title>
    
    <meta name="theme-color" content="#1976d2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <style>
        @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');
        
        * {
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #1976d2;
            --primary-dark: #1565c0;
            --primary-light: #e3f2fd;
            --primary-gradient: linear-gradient(135deg, #1976d2 0%, #1565c0 100%);
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #f0f7ff;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app-container {
            width: 100%;
            max-width: 100%;
            height: 100dvh;
            background: #f0f7ff;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ============ هدر ============ */
        .jozve-header {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 20px;
            background: linear-gradient(135deg, #ffffff 0%, #f0f7ff 100%);
            box-shadow: 0 4px 15px rgba(25, 118, 210, 0.08);
            z-index: 10;
            border-bottom: 2px solid #e3f2fd;
            position: relative;
        }

        .jozve-header-back {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 12px rgba(25, 118, 210, 0.35);
        }

        .jozve-header-back:active {
            transform: translateY(-50%) scale(0.92);
        }

        .jozve-header-back svg {
            width: 22px;
            height: 22px;
            stroke: #fff;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .jozve-header-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(25, 118, 210, 0.35);
            flex-shrink: 0;
        }

        .jozve-header-icon svg {
            width: 22px;
            height: 22px;
            stroke: #fff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .jozve-header-title {
            font-size: 20px;
            font-weight: 900;
            color: var(--primary);
        }

        /* ============ محتوا ============ */
        .jozve-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 15px;
        }

        /* ============ گرید کارت‌ها ============ */
        .jozve-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        /* ============ کارت ============ */
        .jozve-card {
            aspect-ratio: 1 / 1;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(25, 118, 210, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            background: #e3f2fd;
        }

        .jozve-card:active {
            transform: scale(0.97);
            box-shadow: 0 4px 15px rgba(25, 118, 210, 0.3);
        }

        /* پس‌زمینه عکس */
        .jozve-card-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            z-index: 1;
        }

        /* گرادیانت روی عکس */
        .jozve-card-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                180deg,
                rgba(0, 0, 0, 0.3) 0%,
                rgba(0, 0, 0, 0.05) 30%,
                rgba(0, 0, 0, 0.5) 70%,
                rgba(0, 0, 0, 0.85) 100%
            );
            z-index: 2;
            pointer-events: none;
        }

        /* عنوان بالای کارت */
        .jozve-card-title-wrapper {
            position: absolute;
            top: 12px;
            right: 12px;
            left: 12px;
            z-index: 3;
            text-align: right;
        }

        .jozve-card-title {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--primary);
            font-size: 13px;
            font-weight: 900;
            padding: 8px 12px;
            border-radius: 12px;
            display: inline-block;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
            line-height: 1.4;
            max-width: 100%;
        }

        /* آیکون‌های پایین کارت (PDF + عکس) */
        .jozve-card-badges {
            position: absolute;
            bottom: 70px;
            right: 12px;
            display: flex;
            gap: 6px;
            z-index: 3;
        }

        .jozve-card-badge {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #333;
            font-size: 10px;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .jozve-card-badge.pdf {
            color: #d32f2f;
        }

        .jozve-card-badge.images {
            color: #7b1fa2;
        }

        /* دکمه‌های پایین کارت */
        .jozve-card-actions {
            position: absolute;
            bottom: 10px;
            right: 10px;
            left: 10px;
            display: flex;
            gap: 6px;
            z-index: 3;
        }

        .jozve-card-btn {
            flex: 1;
            border: none;
            padding: 9px 6px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 900;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            transition: transform 0.15s ease;
            white-space: nowrap;
        }

        .jozve-card-btn:active {
            transform: scale(0.94);
        }

        .jozve-card-btn svg {
            width: 13px;
            height: 13px;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            flex-shrink: 0;
        }

        .jozve-card-btn.view {
            background: rgba(255, 255, 255, 0.95);
            color: var(--primary);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }

        .jozve-card-btn.view svg {
            stroke: var(--primary);
        }

        .jozve-card-btn.download {
            background: var(--primary-gradient);
            color: #fff;
            box-shadow: 0 3px 12px rgba(25, 118, 210, 0.5);
        }

        .jozve-card-btn.download svg {
            stroke: #fff;
        }

        /* حالت خالی */
        .jozve-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px;
        }

        .jozve-empty-icon {
            font-size: 70px;
            margin-bottom: 18px;
            opacity: 0.6;
        }

        .jozve-empty-text {
            font-size: 16px;
            font-weight: 900;
            color: #78909c;
            line-height: 1.7;
        }

        /* ============ مودال مشاهده ============ */
        .jozve-viewer-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            z-index: 9999;
            animation: fadeIn 0.3s ease;
        }

        .jozve-viewer-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .jozve-viewer-header {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            gap: 12px;
        }

        .jozve-viewer-title {
            flex: 1;
            font-size: 15px;
            font-weight: 900;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .jozve-viewer-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .jozve-viewer-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            padding: 8px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-family: 'Vazirmatn', sans-serif;
            transition: background 0.2s ease;
        }

        .jozve-viewer-btn:active {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0.95);
        }

        .jozve-viewer-btn svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .jozve-viewer-btn.primary {
            background: var(--primary-gradient);
        }

        .jozve-viewer-close {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .jozve-viewer-close:active {
            transform: scale(0.9);
        }

        .jozve-viewer-close svg {
            width: 20px;
            height: 20px;
            stroke: #fff;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* تب‌های PDF / کلمات */
        .jozve-viewer-tabs {
            flex-shrink: 0;
            display: flex;
            gap: 8px;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .jozve-viewer-tabs::-webkit-scrollbar {
            display: none;
        }

        .jozve-viewer-tab {
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.1);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
        }

        .jozve-viewer-tab.active {
            background: var(--primary-gradient);
            border-color: #1976d2;
            box-shadow: 0 3px 10px rgba(25, 118, 210, 0.5);
        }

        .jozve-viewer-tab:active {
            transform: scale(0.96);
        }

        /* بدنه مشاهده */
        .jozve-viewer-body {
            flex: 1;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .jozve-viewer-body img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            background: #fff;
            animation: zoomIn 0.3s ease;
        }

        .jozve-viewer-body iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
            background: #fff;
        }

        @keyframes zoomIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* اسکرول‌بار زیبا */
        .jozve-viewer-body::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .jozve-viewer-body::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .jozve-viewer-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        /* ============ Loading ============ */
        .jozve-loading {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            padding: 80px 20px !important;
            gap: 20px !important;
        }

        .jozve-spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(25, 118, 210, 0.15);
            border-top-color: #1976d2;
            border-right-color: #1976d2;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .jozve-loading-text {
            font-size: 15px;
            font-weight: 900;
            color: #1976d2;
            text-align: center;
        }

        /* ============ ریسپانسیو ============ */
        @media (max-width: 400px) {
            .jozve-card-title {
                font-size: 11px;
                padding: 6px 9px;
            }
            .jozve-card-btn {
                font-size: 10px;
                padding: 7px 4px;
            }
            .jozve-card-btn svg {
                width: 11px;
                height: 11px;
            }
            .jozve-card-badge {
                font-size: 9px;
                padding: 3px 7px;
            }
            .jozve-viewer-title {
                font-size: 13px;
            }
            .jozve-viewer-btn {
                padding: 6px 10px;
                font-size: 11px;
            }
        }

        @media (min-width: 768px) {
            .jozve-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 16px;
            }
        }
    </style>
</head>
<body>

<div id="app-container">
    
    <!-- هدر -->
    <div class="jozve-header">
        <button class="jozve-header-back" onclick="window.location.href='./index.html'">
            <svg viewBox="0 0 24 24"><path d="M9 18L15 12L9 6"/></svg>
        </button>
        
        <div class="jozve-header-icon">
            <svg viewBox="0 0 24 24">
                <path d="M4 19.5C4 18.1193 5.11929 17 6.5 17H20"/>
                <path d="M6.5 2H20V22H6.5C5.11929 22 4 20.8807 4 19.5V4.5C4 3.11929 5.11929 2 6.5 2Z"/>
            </svg>
        </div>
        
        <div class="jozve-header-title">جزوه و کلمات</div>
    </div>
    
    <!-- محتوا -->
    <div class="jozve-content">
        <div class="jozve-grid" id="jozve-grid">
            <!-- کارت‌ها اینجا لود میشن -->
        </div>
    </div>
    
</div>

<!-- مودال مشاهده -->
<div class="jozve-viewer-overlay" id="jozve-viewer">
    <div class="jozve-viewer-header">
        <button class="jozve-viewer-close" onclick="closeJozveViewer()">
            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        
        <div class="jozve-viewer-title" id="jozve-viewer-title">جزوه</div>
        
        <div class="jozve-viewer-actions">
            <button class="jozve-viewer-btn primary" id="jozve-viewer-download-btn" onclick="downloadCurrentFile()">
                <svg viewBox="0 0 24 24">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                دانلود
            </button>
        </div>
    </div>
    
    <!-- تب‌ها (فقط اگه چند فایل داشتیم) -->
    <div class="jozve-viewer-tabs" id="jozve-viewer-tabs" style="display: none;"></div>
    
    <!-- بدنه -->
    <div class="jozve-viewer-body" id="jozve-viewer-body"></div>
</div>

<script>
    // ============================================================
    // متغیرها
    // ============================================================
    let jozveItems = [];
    let currentItem = null;
    let currentFiles = [];
    let currentFileIndex = 0;

    // ============================================================
    // بارگذاری لیست
    // ============================================================
    async function loadJozveList() {
        const grid = document.getElementById('jozve-grid');
        
        // اول لودینگ نشون بده
        grid.innerHTML = `
            <div class="jozve-loading" style="grid-column: 1 / -1;">
                <div class="jozve-spinner"></div>
                <div class="jozve-loading-text">در حال بارگذاری...</div>
            </div>
        `;
        
        try {
            const response = await fetch('./jozve/index.json?t=' + Date.now());
            if (!response.ok) throw new Error('خطا در بارگذاری');
            
            const data = await response.json();
            jozveItems = data.items || [];
            
            renderJozveGrid();
            
        } catch (error) {
            console.error('خطا:', error);
            grid.innerHTML = `
                <div class="jozve-empty" style="grid-column: 1 / -1;">
                    <div class="jozve-empty-icon">📭</div>
                    <div class="jozve-empty-text">هنوز جزوه‌ای اضافه نشده</div>
                </div>
            `;
        }
    }

    // ============================================================
    // رندر کارت‌ها
    // ============================================================
    function renderJozveGrid() {
        const grid = document.getElementById('jozve-grid');
        
        if (jozveItems.length === 0) {
            grid.innerHTML = `
                <div class="jozve-empty" style="grid-column: 1 / -1;">
                    <div class="jozve-empty-icon">📭</div>
                    <div class="jozve-empty-text">هنوز جزوه‌ای اضافه نشده</div>
                </div>
            `;
            return;
        }
        
        let html = '';
        jozveItems.forEach((item, index) => {
            const hasPdf = !!item.pdfFile;
            const hasImages = item.imageFiles && item.imageFiles.length > 0;
            const totalFiles = (hasPdf ? 1 : 0) + (item.imageFiles ? item.imageFiles.length : 0);
            
            html += `
                <div class="jozve-card" onclick="openJozveViewer(${index})">
                    <img src="${item.background}" alt="" class="jozve-card-bg" 
                         onerror="this.style.display='none'; this.parentElement.style.background='linear-gradient(135deg, #1976d2, #6a1b9a)';"
                         loading="lazy">
                    
                    <div class="jozve-card-overlay"></div>
                    
                    <div class="jozve-card-title-wrapper">
                        <div class="jozve-card-title">${item.title}</div>
                    </div>
                    
                    <div class="jozve-card-badges">
                        ${hasPdf ? `<span class="jozve-card-badge pdf">📄 جزوه</span>` : ''}
                        ${hasImages ? `<span class="jozve-card-badge images">📝 کلمات</span>` : ''}
                    </div>
                    
                    <div class="jozve-card-actions">
                        <button class="jozve-card-btn view" onclick="event.stopPropagation(); openJozveViewer(${index})">
                            <svg viewBox="0 0 24 24">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            مشاهده
                        </button>
                        <button class="jozve-card-btn download" onclick="event.stopPropagation(); downloadFromCard(${index})">
                            <svg viewBox="0 0 24 24">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            دانلود
                        </button>
                    </div>
                </div>
            `;
        });
        
        grid.innerHTML = html;
    }

    // ============================================================
    // باز کردن مودال مشاهده
    // ============================================================
    function openJozveViewer(index) {
        const item = jozveItems[index];
        if (!item) return;
        
        currentItem = item;
        currentFiles = [];
        currentFileIndex = 0;
        
        // PDF رو اضافه کن
        if (item.pdfFile) {
            currentFiles.push({
                type: 'pdf',
                title: 'جزوه 📄',
                url: item.pdfFile,
                filename: item.id + '.pdf'
            });
        }
        
        // عکس‌های کلمات رو اضافه کن
        if (item.imageFiles && item.imageFiles.length > 0) {
            item.imageFiles.forEach((url, i) => {
                currentFiles.push({
                    type: 'image',
                    title: item.imageFiles.length > 1 ? `کلمات ${i + 1} 📝` : 'کلمات 📝',
                    url: url,
                    filename: item.id + '_words_' + (i + 1) + '.png'
                });
            });
        }
        
        if (currentFiles.length === 0) {
            alert('فایلی برای این کارت وجود نداره');
            return;
        }
        
        // عنوان مودال
        document.getElementById('jozve-viewer-title').textContent = item.title;
        
        // تب‌ها (فقط اگه بیشتر از ۱ فایل بود)
        const tabsEl = document.getElementById('jozve-viewer-tabs');
        if (currentFiles.length > 1) {
            tabsEl.style.display = 'flex';
            let tabsHTML = '';
            currentFiles.forEach((file, i) => {
                tabsHTML += `
                    <button class="jozve-viewer-tab ${i === 0 ? 'active' : ''}" 
                            onclick="switchJozveTab(${i})">
                        ${file.title}
                    </button>
                `;
            });
            tabsEl.innerHTML = tabsHTML;
        } else {
            tabsEl.style.display = 'none';
        }
        
        // نمایش فایل اول
        showJozveFile(0);
        
        // باز کردن مودال
        document.getElementById('jozve-viewer').classList.add('active');
        
        // جلوگیری از اسکرول
        document.body.style.overflow = 'hidden';
    }

    // ============================================================
    // نمایش فایل خاص
    // ============================================================
    function showJozveFile(index) {
        if (index < 0 || index >= currentFiles.length) return;
        
        currentFileIndex = index;
        const file = currentFiles[index];
        const body = document.getElementById('jozve-viewer-body');
        
        if (file.type === 'pdf') {
            // نمایش PDF با iframe
            body.innerHTML = `
                <iframe src="${file.url}#toolbar=1&navpanes=0" 
                        type="application/pdf">
                </iframe>
            `;
        } else {
            // نمایش عکس
            body.innerHTML = `
                <img src="${file.url}" alt="${file.title}" 
                     onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22300%22><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2248%22>🖼️</text></svg>'">
            `;
        }
        
        // آپدیت تب‌ها
        document.querySelectorAll('.jozve-viewer-tab').forEach((tab, i) => {
            tab.classList.toggle('active', i === index);
        });
    }

    // ============================================================
    // تغییر تب
    // ============================================================
    function switchJozveTab(index) {
        showJozveFile(index);
        vibrate(15);
    }

    // ============================================================
    // دانلود فایل فعلی
    // ============================================================
    function downloadCurrentFile() {
        if (currentFiles.length === 0) return;
        
        const file = currentFiles[currentFileIndex];
        downloadFile(file.url, file.filename);
        vibrate(20);
    }

    // ============================================================
    // دانلود از دکمه کارت (فایل اول - PDF)
    // ============================================================
    function downloadFromCard(index) {
        const item = jozveItems[index];
        if (!item) return;
        
        // اگه PDF داره، اول PDF رو دانلود کن
        if (item.pdfFile) {
            downloadFile(item.pdfFile, item.id + '.pdf');
        } 
        // وگرنه اولین عکس رو دانلود کن
        else if (item.imageFiles && item.imageFiles.length > 0) {
            downloadFile(item.imageFiles[0], item.id + '_words_1.png');
        }
        
        vibrate(20);
    }

    // ============================================================
    // تابع دانلود
    // ============================================================
    function downloadFile(url, filename) {
        // برای فایل‌های خارجی، از fetch استفاده کن
        fetch(url)
            .then(response => response.blob())
            .then(blob => {
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
            })
            .catch(error => {
                // اگه fetch نشد، مستقیم باز کن
                console.warn('fetch نشد، مستقیم دانلود می‌کنم', error);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            });
    }

    // ============================================================
    // بستن مودال
    // ============================================================
    function closeJozveViewer() {
        document.getElementById('jozve-viewer').classList.remove('active');
        document.getElementById('jozve-viewer-body').innerHTML = '';
        document.body.style.overflow = '';
        
        currentItem = null;
        currentFiles = [];
        currentFileIndex = 0;
    }

    // ============================================================
    // ویبره
    // ============================================================
    function vibrate(pattern = 20) {
        if (navigator.vibrate) navigator.vibrate(pattern);
    }

    // ============================================================
    // بستن با دکمه Back
    // ============================================================
    window.addEventListener('popstate', function() {
        const viewer = document.getElementById('jozve-viewer');
        if (viewer && viewer.classList.contains('active')) {
            closeJozveViewer();
        } else {
            window.location.href = './index.html';
        }
    });

    history.pushState(null, null, location.href);

    // ============================================================
    // شروع
    // ============================================================
    window.addEventListener('load', () => {
        loadJozveList();
    });
</script>

</body>
